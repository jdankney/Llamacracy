# oauth2-proxy config for Llamacracy. Non-secret settings only.
# Secrets (client id/secret, cookie secret) come from deploy/oauth2-proxy.env
# (gitignored). http_address is injected at start from wt0.

provider = "oidc"

# Llamacracy's own Dex (deploy/dex/), on the NetBird interface of this box.
# NOT NetBird's embedded IdP -- that one can't take extra clients. Plain HTTP
# is fine: the whole path is inside the WireGuard tunnel.
oidc_issuer_url = "http://myhost.netbird.selfhosted:5556"
scope = "openid email profile offline_access"   # offline_access -> refresh token for cookie_refresh
email_domains = ["*"]                 # trust anyone Dex authenticates; the user list lives in dex/config.yaml
skip_provider_button = true           # one connector, go straight to the login form

# Fixed callback -- must match a redirectURI in deploy/dex/config.yaml. Friends
# MUST reach the app as http://myhost.netbird.selfhosted:4180 (not the raw
# wt0 IP), or the post-login redirect lands on the wrong cookie host and loops.
redirect_url = "http://myhost.netbird.selfhosted:4180/oauth2/callback"

# the app it protects -- 127.0.0.1 only
upstreams = "http://127.0.0.1:8000"
pass_access_token = false
pass_authorization_header = false
set_xauthrequest = true
pass_user_headers = true              # X-Forwarded-User (sub), X-Forwarded-Email, X-Forwarded-Preferred-Username
prefer_email_to_user = false          # keep X-Forwarded-User = sub

# sessions
cookie_name = "_llamacracy"
cookie_secure = false                 # plain HTTP over the NetBird tunnel (private, encrypted at the WG layer)
cookie_samesite = "lax"
cookie_expire = "168h"
cookie_refresh = "1h"

# reverse-proxy awareness (single hop, oauth2-proxy itself is the edge)
reverse_proxy = false
skip_auth_routes = ["GET=/healthz"]
