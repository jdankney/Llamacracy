# oauth2-proxy config for Llamacracy. Non-secret, host-independent settings
# only. Everything that is a secret or names your host lives in
# deploy/oauth2-proxy.env (gitignored): client id/secret, cookie secret,
# OAUTH2_PROXY_OIDC_ISSUER_URL and OAUTH2_PROXY_REDIRECT_URL (both pinned to
# your NetBird FQDN). http_address is injected at start from wt0 by the
# systemd unit.

provider = "oidc"

# Llamacracy's own Dex (deploy/dex/), on the NetBird interface of this box.
# NOT NetBird's embedded IdP -- that one can't take extra clients. Plain HTTP
# is fine: the whole path is inside the WireGuard tunnel.
scope = "openid email profile offline_access"   # offline_access -> refresh token for cookie_refresh
email_domains = ["*"]                 # trust anyone Dex authenticates; the user list lives in dex/config.yaml
skip_provider_button = true           # one connector, go straight to the login form

# Users MUST reach the app by the FQDN in OAUTH2_PROXY_REDIRECT_URL (not the
# raw wt0 IP), or the post-login redirect lands on the wrong cookie host and
# loops.

# the app it protects -- 127.0.0.1 only
upstreams = "http://127.0.0.1:8000"
pass_access_token = false
pass_authorization_header = false
set_xauthrequest = true
pass_user_headers = true              # X-Forwarded-User (sub), X-Forwarded-Email, X-Forwarded-Preferred-Username
prefer_email_to_user = false          # keep X-Forwarded-User = sub

# sessions
cookie_name = "_llamacracy"
cookie_secure = false                 # plain HTTP over the NetBird tunnel (private, encrypted at the WG layer)
cookie_samesite = "lax"
cookie_expire = "168h"
cookie_refresh = "1h"

# reverse-proxy awareness (single hop, oauth2-proxy itself is the edge)
reverse_proxy = false
# /v1/* is the OpenAI-compatible API for IDE tools (Continue.dev etc) -- those
# aren't browser sessions, so they can't do the OIDC cookie dance. Skipping
# auth here means oauth2-proxy just proxies the request through
# unauthenticated (including the client's own Authorization header,
# untouched) -- llamacracy/identity.py's get_principal_api_key is the only
# gate on these two paths, checking a bearer API key against the app's own
# api_keys table. Everything else still requires a real login.
skip_auth_routes = ["GET=/healthz", "GET=^/v1/models$", "POST=^/v1/chat/completions$"]
