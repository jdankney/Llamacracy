# Llamacracy's identity provider. Managed by systemd, not run by hand:
#
#   systemctl --user enable --now llamacracy-dex.service
#
# (deploy/systemd/llamacracy-dex.service). That unit discovers wt0's current
# address on every start and exports it as DEX_BIND_ADDR before calling
# `docker compose up -d`, so a NetBird peer re-enrol (a new wt0 address) is
# fixed by `systemctl --user restart llamacracy-dex` -- or just a reboot --
# instead of hand-editing this file. Manual `docker compose up -d` from this
# directory still works, but needs DEX_BIND_ADDR exported first:
#
#   DEX_BIND_ADDR=$(ip -4 -o addr show wt0 | awk '{print $4}' | cut -d/ -f1) \
#     docker compose up -d
#
# First-time setup is unchanged: cp config.yaml.example config.yaml, fill in
# the secret + password hashes (see README.md), then start the unit above.

services:
  dex:
    image: ghcr.io/dexidp/dex:v2.44.0
    container_name: llamacracy-dex
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./config.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    ports:
      - "${DEX_BIND_ADDR:?set DEX_BIND_ADDR to the current wt0 address -- see the comment above}:5556:5556"

volumes:
  dex-data:
