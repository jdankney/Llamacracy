<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Llamacracy</title>
<meta name="description" content="Self-hosted multi-model LLM chat hub.">
<link rel="icon" href="/assets/llamacracy-favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<!-- PWA: installable from the phone's browser, no App Store / Play Store
     involved. iOS honors the old apple-* tags for "Add to Home Screen"
     (works without HTTPS -- that mechanism predates and doesn't require the
     Service Worker / installability spec); the manifest covers Android +
     modern Safari too. No service worker: it needs a secure context (https
     or localhost) to register at all, and this app is deliberately plain
     HTTP (the NetBird/WireGuard tunnel is the encryption layer) -- one would
     just silently fail here, and there's no meaningful offline mode for a
     live-inference chat anyway. -->
<link rel="manifest" href="/assets/manifest.webmanifest">
<meta name="theme-color" content="#151a23">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Llamacracy">
<link rel="stylesheet" href="/assets/styles.css">
<!-- markdown rendering: parser + HTML sanitiser + code highlighting + math.
     Classic scripts, so they're ready before the deferred module app.js. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.21/katex.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.21/katex.min.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
